<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Fleet Board</title>
<style>
  :root {
    --bg: #14181a;
    --panel: #1c2124;
    --line: #2b3236;
    --text: #e7e3d8;
    --muted: #8b948f;
    --accent: #5fa777;
    --warn: #e0a458;
    --crit: #c1503d;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 2.5rem 1.5rem 4rem;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1.5rem;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 0.25rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  .live-dot.down { background: var(--crit); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .summary {
    display: flex;
    gap: 2.5rem;
    margin-bottom: 2rem;
  }

  .summary-value {
    display: block;
    font-family: var(--mono);
    font-size: 2.25rem;
    font-variant-numeric: tabular-nums;
  }

  .summary-label {
    display: block;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.15rem;
  }

  .board { border-top: 1px solid var(--line); }

  .row {
    display: grid;
    grid-template-columns: 1fr 90px 120px 70px;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--line);
  }

  .row-name { font-size: 0.95rem; }

  .row-capacity {
    color: var(--muted);
    font-size: 0.8rem;
    font-family: var(--mono);
  }

  .row-bar {
    height: 4px;
    background: var(--panel);
    border-radius: 2px;
    overflow: hidden;
  }

  .row-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.6s ease;
  }

  .row-bar-fill.warn { background: var(--warn); }
  .row-bar-fill.crit { background: var(--crit); }

  .row-count {
    font-family: var(--mono);
    font-size: 1.1rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .empty, .error {
    padding: 2.5rem 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .error { color: var(--crit); }

  footer { margin-top: 2rem; }

  button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.85rem;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover { border-color: var(--accent); }

  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr 60px 40px; }
    .row-capacity { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
    .row-bar-fill { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Meridian Fleet Board</h1>
        <p class="subtitle">Live dock status across all stations</p>
      </div>
      <div class="status">
        <span class="live-dot" id="liveDot"></span>
        <span id="statusText">connecting</span>
      </div>
    </header>

    <section class="summary">
      <div>
        <span class="summary-value" id="totalFree">--</span>
        <span class="summary-label">bikes free</span>
      </div>
      <div>
        <span class="summary-value" id="totalStations">--</span>
        <span class="summary-label">stations</span>
      </div>
    </section>

    <main>
      <div class="board" id="board"></div>
    </main>

    <footer>
      <button id="refreshBtn" type="button">Refresh</button>
    </footer>
  </div>

<script>
  const board = document.getElementById('board');
  const statusText = document.getElementById('statusText');
  const liveDot = document.getElementById('liveDot');
  const totalFreeEl = document.getElementById('totalFree');
  const totalStationsEl = document.getElementById('totalStations');
  const refreshBtn = document.getElementById('refreshBtn');

  function countUp(el, target, duration = 500) {
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      el.textContent = Math.round(progress * target);
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function levelClass(free, capacity) {
    if (capacity === 0) return '';
    const ratio = free / capacity;
    if (ratio === 0) return 'crit';
    if (ratio < 0.25) return 'warn';
    return '';
  }

  async function loadStations() {
    statusText.textContent = 'connecting';
    liveDot.classList.remove('down');
    board.innerHTML = '<p class="empty">Loading stations…</p>';

    try {
      const res = await fetch('/stations');
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const stations = await res.json();

      if (!Array.isArray(stations) || stations.length === 0) {
        board.innerHTML = '<p class="empty">No stations found.</p>';
        totalFreeEl.textContent = '0';
        totalStationsEl.textContent = '0';
        statusText.textContent = 'live';
        return;
      }

      board.innerHTML = '';
      let totalFree = 0;

      stations.forEach(s => {
        const free = s.free_bikes ?? 0;
        const capacity = s.capacity ?? 0;
        totalFree += free;

        const row = document.createElement('div');
        row.className = 'row';

        const fillPct = capacity > 0 ? Math.min((free / capacity) * 100, 100) : 0;
        const cls = levelClass(free, capacity);

        row.innerHTML = `
          <span class="row-name">${s.name ?? 'Unnamed station'}</span>
          <span class="row-capacity">${capacity} docks</span>
          <div class="row-bar"><div class="row-bar-fill ${cls}" style="width:${fillPct}%"></div></div>
          <span class="row-count">00</span>
        `;
        board.appendChild(row);
        countUp(row.querySelector('.row-count'), free);
      });

      countUp(totalFreeEl, totalFree);
      totalStationsEl.textContent = stations.length;
      statusText.textContent = 'live';
    } catch (err) {
      board.innerHTML = '<p class="error">Unable to reach the API. Check that the server is running, then refresh.</p>';
      statusText.textContent = 'offline';
      liveDot.classList.add('down');
    }
  }

  refreshBtn.addEventListener('click', loadStations);
  loadStations();
</script>
</body>
</html>
